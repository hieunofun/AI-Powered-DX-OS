# ==============================================================================
# SmartProcure-Pay - Docker Compose Infrastructure (Issue #1 Foundation)
# ==============================================================================
# Active Services for Bootstrap Foundation:
# 1. smartprocure-postgres: Relational database store
# 2. smartprocure-api: NestJS backend API with health endpoint
# 3. smartprocure-web: React + TypeScript + Vite web client
# 4. smartprocure-minio: Private invoice storage (Issue #7)
#
# Roadmap service (ImmuDB) is maintained
# as documented placeholders for subsequent implementation phases.
# ==============================================================================

version: '3.8'

networks:
  smartprocure-network:
    name: smartprocure-network
    driver: bridge

volumes:
  minio_data:
    name: smartprocure_minio_data
  postgres_data:
    name: smartprocure_postgres_data
  flowable_postgres_data:
    name: smartprocure_flowable_postgres_data

services:
  # ----------------------------------------------------------------------------
  # 1. Primary Relational Store: PostgreSQL
  # ----------------------------------------------------------------------------
  smartprocure-postgres:
    image: postgres:16-alpine
    container_name: smartprocure-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-smartprocure_db}
      POSTGRES_USER: ${POSTGRES_USER:-smartprocure_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres_password}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/migrations:/docker-entrypoint-initdb.d:ro
    networks:
      - smartprocure-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-smartprocure_user} -d ${POSTGRES_DB:-smartprocure_db}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ----------------------------------------------------------------------------
  # 2. Backend Application API: NestJS
  # ----------------------------------------------------------------------------
  smartprocure-api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: smartprocure-api
    restart: unless-stopped
    environment:
      PORT: ${API_PORT:-4000}
      NODE_ENV: ${NODE_ENV:-production}
      ENABLE_CORS: ${ENABLE_CORS:-false}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:3000}
      POSTGRES_HOST: smartprocure-postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-smartprocure_db}
      POSTGRES_USER: ${POSTGRES_USER:-smartprocure_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres_password}
      KEYCLOAK_ISSUER: ${KEYCLOAK_ISSUER:-http://localhost:8080/realms/smartprocure}
      KEYCLOAK_JWKS_URI: ${KEYCLOAK_JWKS_URI:-http://smartprocure-keycloak:8080/realms/smartprocure/protocol/openid-connect/certs}
      KEYCLOAK_AUDIENCE: ${KEYCLOAK_AUDIENCE:-smartprocure-api}
      ENABLE_SWAGGER: ${ENABLE_SWAGGER:-false}
      MINIO_ENDPOINT: smartprocure-minio
      MINIO_PORT: 9000
      # DEV/CI ONLY defaults. Production must override both credentials.
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-minio_dev_only}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-minio_dev_password_only}
      MINIO_BUCKET_INVOICES: ${MINIO_BUCKET_INVOICES:-invoices}
      MINIO_USE_SSL: ${MINIO_USE_SSL:-false}
      INVOICE_XML_MAX_BYTES: ${INVOICE_XML_MAX_BYTES:-5242880}
      INVOICE_PDF_MAX_BYTES: ${INVOICE_PDF_MAX_BYTES:-20971520}
      FLOWABLE_URL: ${FLOWABLE_URL:-http://smartprocure-flowable:8080/flowable-rest/service}
      FLOWABLE_USERNAME: ${FLOWABLE_USERNAME:-workflow-service}
      FLOWABLE_PASSWORD: ${FLOWABLE_PASSWORD:-flowable_dev_only_password}
      FLOWABLE_PROCESS_KEY: ${FLOWABLE_PROCESS_KEY:-invoiceExceptionWorkflow}
      FLOWABLE_TIMEOUT_MS: ${FLOWABLE_TIMEOUT_MS:-10000}
    ports:
      - "${API_PORT:-4000}:4000"
    networks:
      - smartprocure-network
    depends_on:
      smartprocure-postgres:
        condition: service_healthy
      smartprocure-minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:4000/health || exit 1"]
      interval: 10s
      timeout: 5s
      start_period: 5s
      retries: 3

  # ----------------------------------------------------------------------------
  # 3. Web Frontend: React + TypeScript + Vite (Served via Nginx)
  # ----------------------------------------------------------------------------
  smartprocure-web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-/api}
        VITE_KEYCLOAK_URL: ${VITE_KEYCLOAK_URL:-http://localhost:8080}
        VITE_KEYCLOAK_REALM: ${VITE_KEYCLOAK_REALM:-smartprocure}
        VITE_KEYCLOAK_CLIENT_ID: ${VITE_KEYCLOAK_CLIENT_ID:-smartprocure-web}
    container_name: smartprocure-web
    restart: unless-stopped
    ports:
      - "${APP_PORT:-3000}:80"
    networks:
      - smartprocure-network
    depends_on:
      - smartprocure-api
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://127.0.0.1/ || exit 1"]
      interval: 10s
      timeout: 5s
      start_period: 5s
      retries: 3

  # ----------------------------------------------------------------------------
  # 4. Identity & Access Management: Keycloak (OIDC / OAuth 2.0 / RBAC)
  # ----------------------------------------------------------------------------
  smartprocure-keycloak:
    image: quay.io/keycloak/keycloak:24.0.5
    container_name: smartprocure-keycloak
    restart: unless-stopped
    command: start-dev --import-realm
    environment:
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN:-admin}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin_dev_password}
      KC_HEALTH_ENABLED: "true"
      KC_HTTP_PORT: 8080
    ports:
      - "${KEYCLOAK_PORT:-8080}:8080"
    volumes:
      - ./infra/keycloak/realm-smartprocure.json:/opt/keycloak/data/import/realm-smartprocure.json:ro
    networks:
      - smartprocure-network
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/8080 || exit 1"]
      interval: 10s
      timeout: 5s
      start_period: 25s
      retries: 5

  # ----------------------------------------------------------------------------
  # 5. API Gateway: Apache APISIX (Issue #4 Integrated)
  # ----------------------------------------------------------------------------
  smartprocure-apisix:
    image: apache/apisix:3.19.0-debian
    container_name: smartprocure-apisix
    restart: unless-stopped
    environment:
      APISIX_STAND_ALONE: "true"
      APISIX_OIDC_CLIENT_ID: ${APISIX_OIDC_CLIENT_ID:-smartprocure-gateway}
      APISIX_OIDC_CLIENT_SECRET: ${APISIX_OIDC_CLIENT_SECRET:-gateway_dev_secret_123}
    ports:
      - "${APISIX_PORT:-9080}:9080"
      - "127.0.0.1:${APISIX_METRICS_PORT:-9091}:9091"
    volumes:
      - ./infra/apisix/config.yaml:/usr/local/apisix/conf/config.yaml:ro
      - ./infra/apisix/apisix.yaml:/usr/local/apisix/conf/apisix.yaml:ro
    networks:
      - smartprocure-network
    depends_on:
      - smartprocure-web
      - smartprocure-api
      - smartprocure-keycloak
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/9080' || exit 1"]
      interval: 10s
      timeout: 5s
      start_period: 10s
      retries: 5

  # Issue #7: unmodified AGPLv3 MinIO, built from pinned official source.
  smartprocure-minio:
    image: smartprocure-minio:RELEASE.2025-10-15T17-29-55Z
    build:
      context: .
      dockerfile: infra/minio/Dockerfile
    container_name: smartprocure-minio
    restart: unless-stopped
    environment:
      # DEV/CI ONLY; production MUST override secrets and use a scoped API account.
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-minio_dev_only}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-minio_dev_password_only}
    ports:
      - "127.0.0.1:${MINIO_PORT:-9000}:9000"
      - "127.0.0.1:${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio_data:/data
    networks:
      - smartprocure-network
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      start_period: 10s
      retries: 20

  # Issue #9: isolated persistent engine database; no host database port.
  smartprocure-flowable-postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: flowable
      POSTGRES_USER: flowable
      POSTGRES_PASSWORD: ${FLOWABLE_DB_PASSWORD:-flowable_db_dev_only_password}
    volumes:
      - flowable_postgres_data:/var/lib/postgresql/data
    networks:
      - smartprocure-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U flowable -d flowable"]
      interval: 5s
      timeout: 3s
      retries: 20

  smartprocure-flowable:
    # Verified official release/image. Digest pins the multi-platform manifest.
    image: flowable/flowable-rest:8.0.0@sha256:708dfa32f27b93180bb6e7a30684d881d995fe257f5b8413e14b20a55c25672d
    container_name: smartprocure-flowable
    restart: unless-stopped
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://smartprocure-flowable-postgres:5432/flowable
      SPRING_DATASOURCE_USERNAME: flowable
      SPRING_DATASOURCE_PASSWORD: ${FLOWABLE_DB_PASSWORD:-flowable_db_dev_only_password}
      FLOWABLE_REST_APP_ADMIN_USER_ID: ${FLOWABLE_USERNAME:-workflow-service}
      FLOWABLE_REST_APP_ADMIN_PASSWORD: ${FLOWABLE_PASSWORD:-flowable_dev_only_password}
      FLOWABLE_REST_APP_AUTHENTICATION_MODE: verify-privilege
      FLOWABLE_HISTORY_LEVEL: full
      FLOWABLE_REST_APP_CREATE_DEMO_USERS: "false"
      FLOWABLE_REST_APP_CREATE_DEMO_DEFINITIONS: "false"
    ports:
      - "127.0.0.1:${FLOWABLE_PORT:-8088}:8080"
    networks:
      - smartprocure-network
    depends_on:
      smartprocure-flowable-postgres:
        condition: service_healthy
    healthcheck:
      # Engine REST health requires authentication; secrets never appear in logs.
      test: ["CMD-SHELL", "curl -fsS -u \"$$FLOWABLE_REST_APP_ADMIN_USER_ID:$$FLOWABLE_REST_APP_ADMIN_PASSWORD\" http://localhost:8080/flowable-rest/service/management/engine > /dev/null"]
      interval: 5s
      timeout: 5s
      start_period: 40s
      retries: 30

