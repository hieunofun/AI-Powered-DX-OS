# ==============================================================================
# SmartProcure-Pay - Docker Compose Infrastructure Skeleton (Phase 0)
# ==============================================================================
# In Phase 0, this file defines the core network and skeleton definitions.
# Heavy infrastructure services are documented with clear integration milestones
# to avoid spinning up unused containers prior to actual application implementation.
# ==============================================================================

version: '3.8'

networks:
  smartprocure-network:
    name: smartprocure-network
    driver: bridge

volumes:
  postgres_data:
    name: smartprocure_postgres_data

services:
  # ----------------------------------------------------------------------------
  # Primary Relational Store: PostgreSQL (Domain Entities & Application State)
  # Planned for activation in Phase 1 / Issue #2
  # ----------------------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: smartprocure-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-smartprocure_db}
      POSTGRES_USER: ${POSTGRES_USER:-smartprocure_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres_password}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/migrations:/docker-entrypoint-initdb.d:ro
    networks:
      - smartprocure-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-smartprocure_user} -d ${POSTGRES_DB:-smartprocure_db}"]
      interval: 10s
      timeout: 5s
      retries: 5

