# ==============================================================================
# SmartProcure-Pay - Docker Compose Infrastructure (Issue #1 Foundation)
# ==============================================================================
# Active Services for Bootstrap Foundation:
# 1. smartprocure-postgres: Relational database store
# 2. smartprocure-api: NestJS backend API with health endpoint
# 3. smartprocure-web: React + TypeScript + Vite web client
#
# Roadmap services (Keycloak, APISIX, MinIO, Flowable, ImmuDB) are maintained
# as documented placeholders for subsequent implementation phases.
# ==============================================================================

version: '3.8'

networks:
  smartprocure-network:
    name: smartprocure-network
    driver: bridge

volumes:
  postgres_data:
    name: smartprocure_postgres_data

services:
  # ----------------------------------------------------------------------------
  # 1. Primary Relational Store: PostgreSQL
  # ----------------------------------------------------------------------------
  smartprocure-postgres:
    image: postgres:16-alpine
    container_name: smartprocure-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-smartprocure_db}
      POSTGRES_USER: ${POSTGRES_USER:-smartprocure_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres_password}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/migrations:/docker-entrypoint-initdb.d:ro
    networks:
      - smartprocure-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-smartprocure_user} -d ${POSTGRES_DB:-smartprocure_db}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ----------------------------------------------------------------------------
  # 2. Backend Application API: NestJS
  # ----------------------------------------------------------------------------
  smartprocure-api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: smartprocure-api
    restart: unless-stopped
    environment:
      PORT: ${API_PORT:-4000}
      NODE_ENV: ${NODE_ENV:-production}
      POSTGRES_HOST: smartprocure-postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-smartprocure_db}
      POSTGRES_USER: ${POSTGRES_USER:-smartprocure_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres_password}
    ports:
      - "${API_PORT:-4000}:4000"
    networks:
      - smartprocure-network
    depends_on:
      smartprocure-postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:4000/health || exit 1"]
      interval: 10s
      timeout: 5s
      start_period: 5s
      retries: 3

  # ----------------------------------------------------------------------------
  # 3. Web Frontend: React + TypeScript + Vite (Served via Nginx)
  # ----------------------------------------------------------------------------
  smartprocure-web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:4000}
    container_name: smartprocure-web
    restart: unless-stopped
    ports:
      - "${APP_PORT:-3000}:80"
    networks:
      - smartprocure-network
    depends_on:
      - smartprocure-api
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:80 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3

