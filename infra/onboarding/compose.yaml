name: opendx-issue60
# Isolated synthetic acceptance; stop preserves all databases, objects and signatures.
services:
  postgres:
    extends:
      file: ../lineage/compose.yaml
      service: postgres
    environment:
      POSTGRES_DB: onboarding_issue60
      POSTGRES_USER: onboarding_fixture
      POSTGRES_PASSWORD: onboarding_fixture_local_only
    ports: !override ["127.0.0.1:15460:5432"]
    volumes: !override ["postgres:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U onboarding_fixture -d onboarding_issue60"]
  minio:
    extends:
      file: ../lineage/compose.yaml
      service: minio
    environment:
      MINIO_ROOT_USER: onboarding_fixture
      MINIO_ROOT_PASSWORD: onboarding_fixture_local_only
    ports: !override ["127.0.0.1:19460:9000"]
    volumes: !override ["minio:/data"]
  scanner:
    extends:
      file: ../evidence/compose.yaml
      service: scanner
    ports: !override ["127.0.0.1:33160:3310"]
    volumes: !override ["definitions:/var/lib/clamav"]
  flowable-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: flowable
      POSTGRES_USER: flowable
      POSTGRES_PASSWORD: onboarding_flowable_fixture_local_only
    volumes: ["flowable-db:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U flowable -d flowable"]
      interval: 5s
      timeout: 3s
      retries: 30
    mem_limit: 512m
  flowable:
    image: flowable/flowable-rest:8.0.0@sha256:708dfa32f27b93180bb6e7a30684d881d995fe257f5b8413e14b20a55c25672d
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://flowable-db:5432/flowable
      SPRING_DATASOURCE_USERNAME: flowable
      SPRING_DATASOURCE_PASSWORD: onboarding_flowable_fixture_local_only
      FLOWABLE_REST_APP_ADMIN_USER_ID: onboarding-service
      FLOWABLE_REST_APP_ADMIN_PASSWORD: onboarding_engine_fixture_local_only
      FLOWABLE_REST_APP_AUTHENTICATION_MODE: verify-privilege
      FLOWABLE_HISTORY_LEVEL: full
      FLOWABLE_REST_APP_CREATE_DEMO_USERS: "false"
      FLOWABLE_REST_APP_CREATE_DEMO_DEFINITIONS: "false"
      JAVA_TOOL_OPTIONS: -Xmx768m
    ports: ["127.0.0.1:18060:8080"]
    depends_on:
      flowable-db:
        condition: service_healthy
    mem_limit: 1536m
volumes:
  postgres:
  minio:
  definitions:
  flowable-db:
